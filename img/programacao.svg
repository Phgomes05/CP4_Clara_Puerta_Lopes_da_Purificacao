<rect width="600" height="360" rx="24" fill="#ede9fe"/>
<rect x="70" y="55" width="460" height="230" rx="14" fill="#1e1b4b"/>
<rect x="95" y="82" width="410" height="175" rx="8" fill="#111827"/>
<g font-family="monospace" font-size="18">
<text x="120" y="120" fill="#c4b5fd">&lt;section&gt;</text>
<text x="145" y="155" fill="#93c5fd">const</text>
<text x="210" y="155" fill="#f9a8d4">site</text>
<text x="270" y="155" fill="#fff">=</text>
<text x="290" y="155" fill="#86efac">"Clara"</text>
<text x="120" y="190" fill="#fbbf24">function</text>
